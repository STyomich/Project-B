services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-projectb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password@1
    ports:
      - "1433:1433"
    networks:
      - app-network
    volumes:
      - sql-data:/var/opt/mssql

  api:
    build:
      context: ./backend  # Build context is backend/
      dockerfile: ../dockerfiles/Backend.Dockerfile  # Reference Dockerfile outside the context
    container_name: backend-projectb
    depends_on:
      - sql
    ports:
      - "5000:8080"
    networks:
      - app-network
  frontend:
    build:
      context: ./frontend  # Build context is frontend/
      dockerfile: ../dockerfiles/Frontend.Dockerfile  # Reference Dockerfile outside the context
    container_name: frontend-projectb
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://api:8080
networks:
  app-network:
volumes:
  sql-data:
